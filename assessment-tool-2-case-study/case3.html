<!doctype html><html><head><meta charset="utf-8"><title>QuickBite Cloud Ordering</title><style>body{font-family:Arial;margin:0;background:#f5f7fb;color:#1f2937}.top{background:#fff;padding:20px 35px;border-bottom:1px solid #ddd;font-size:22px;font-weight:700}.wrap{padding:30px;display:grid;grid-template-columns:1fr 360px;gap:25px}.menu,.cart{background:white;border-radius:14px;padding:24px;box-shadow:0 2px 10px #dbe1ea}.item{display:flex;justify-content:space-between;border-bottom:1px solid #eee;padding:18px 0}.price{font-weight:700}.btn{background:#e85d04;color:#fff;border:0;padding:9px 14px;border-radius:7px}.api{margin-top:20px;background:#111827;color:#d1fae5;padding:14px;border-radius:8px;font-family:monospace;font-size:12px}.status{margin-top:18px;padding:14px;background:#ecfdf5;border:1px solid #a7f3d0;border-radius:8px;color:#065f46;font-weight:700}</style></head><body><div class="top">QuickBite Cloud Ordering</div><div class="wrap"><section class="menu"><h2>Chennai Kitchen</h2><div class="item"><div><b>Paneer Biryani</b><br><small>Cloud Kitchen Special</small></div><div><span class="price">₹220</span> <button class="btn" onclick="add('Paneer Biryani',220)">Add</button></div></div><div class="item"><div><b>Veg Fried Rice</b><br><small>Fresh vegetables</small></div><div><span class="price">₹160</span> <button class="btn" onclick="add('Veg Fried Rice',160)">Add</button></div></div><div class="item"><div><b>Masala Dosa</b><br><small>Crispy dosa</small></div><div><span class="price">₹110</span> <button class="btn" onclick="add('Masala Dosa',110)">Add</button></div></div><div class="api">GET /api/menu → 200 OK<br>POST /api/orders → ready<br>Storage: invoices + menu images + customer data</div></section><aside class="cart"><h2>Your Order</h2><div id="cart"><p>No items added.</p></div><div id="total">Total: ₹0</div><button class="btn" style="width:100%;margin-top:15px" onclick="place()">Place Order</button><div id="status"></div></aside></div><script>let items=[];function add(n,p){items.push([n,p]);render()}function render(){cart.innerHTML=items.length?items.map(x=>'<p>'+x[0]+' — ₹'+x[1]+'</p>').join(''):'<p>No items added.</p>';total.innerText='Total: ₹'+items.reduce((a,x)=>a+x[1],0)}function place(){if(!items.length)return;status.innerHTML='<div class="status">✓ Order #QB-1048 confirmed — API 201 Created<br>Estimated delivery: 32 minutes</div>'}</script></body></html>
